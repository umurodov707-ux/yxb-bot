services:
  - type: web
    name: yxb-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./yxb.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: DEV_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
